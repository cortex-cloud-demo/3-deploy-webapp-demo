apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Reference the deployment manifest
resources:
  - deployment.yaml
# Dynamically set the Docker image name and tag
images:
  - name: IMAGE_PLACEHOLDER # Matches placeholder in deployment.yaml
    newName: "783648732931.dkr.ecr.eu-west-3.amazonaws.com/k8s-escape-demo" # Can be changed dynamically
    newTag: "build-21" # Can be updated via CI/CD
